name: Publish busybox (vi editing)

# Builds the musl variant with CONFIG_FEATURE_EDITING_VI and pushes it to
# ghcr.io, so "set -o vi" works in the shipped ash. Upstream's config has
# that option "default n".

on:
  push:
    branches:
      - vi-line-editing
  workflow_dispatch:

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    env:
      BASHBREW_ARCH: amd64
      DIR: latest/musl
    steps:
      - uses: actions/checkout@v4
      - uses: docker-library/bashbrew@HEAD

      # Dockerfiles are generated, so the template edit only takes effect once
      # this has run, and build.sh reads the generated Dockerfile.builder.
      - name: Regenerate Dockerfiles
        run: |
          sudo apt-get update && sudo apt-get install -y gawk
          ./apply-templates.sh

      - name: Confirm the option reached the build
        run: grep -q 'CONFIG_FEATURE_EDITING_VI=y' "$DIR/Dockerfile.builder"

      - name: Build
        run: ./build.sh "$DIR"

      - name: Verify vi editing is compiled in
        run: |
          docker build -t busybox-vi "$DIR"
          # Reads back "off" unless the feature is present, whatever "set -o vi" returns.
          docker run --rm busybox-vi sh -ic 'set -o vi; set -o' | grep -E '^vi[[:space:]]+on$'

      - name: Push
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER}/busybox-vi"
          docker tag busybox-vi "$repo:1.38.0-musl"
          docker tag busybox-vi "$repo:latest"
          docker push "$repo:1.38.0-musl"
          docker push "$repo:latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
